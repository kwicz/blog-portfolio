<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Bag body (squarish, not too tall) -->
  <path d="M 16 50 L 72 50 L 72 90 Q 72 93 69 93 L 19 93 Q 16 93 16 90 Z"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left handle arch (tall, prominent) -->
  <path d="M 26 50 C 26 18 44 18 44 50"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- Right handle arch -->
  <path d="M 52 50 C 52 18 70 18 70 50"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- Handle attachment rings -->
  <circle cx="26" cy="50" r="2.5" stroke="#2A262F" stroke-width="2" fill="none"/>
  <circle cx="44" cy="50" r="2.5" stroke="#2A262F" stroke-width="2" fill="none"/>
  <circle cx="52" cy="50" r="2.5" stroke="#2A262F" stroke-width="2" fill="none"/>
  <circle cx="70" cy="50" r="2.5" stroke="#2A262F" stroke-width="2" fill="none"/>
  <!-- Price tag string -->
  <path d="M 70 54 C 74 62 76 66 76 68"
        stroke="#2A262F" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Price tag body -->
  <path d="M 73 68 L 73 84 Q 73 87 76 87 L 85 87 Q 88 87 88 84 L 88 68 Q 88 65 85 65 L 76 65 Q 73 65 73 68 Z"
        stroke="#2A262F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Tag hole -->
  <circle cx="76" cy="68" r="2.5" stroke="#2A262F" stroke-width="2" fill="none"/>
  <!-- Bag shading lines (3 only, not 4) -->
  <line x1="20" y1="62" x2="64" y2="62" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="74" x2="64" y2="74" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="86" x2="64" y2="86" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
</svg>
