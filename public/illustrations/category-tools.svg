<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 8-tooth gear outline (center 48,48; r_outer=30; r_inner=22; teeth ±7.5° each) -->
  <path d="M 70 45 L 78 44 L 78 52 L 70 51
           A 22 22 0 0 1 65 61
           L 72 66 L 66 72 L 61 65
           A 22 22 0 0 1 51 70
           L 52 78 L 44 78 L 45 70
           A 22 22 0 0 1 35 65
           L 30 72 L 24 66 L 31 61
           A 22 22 0 0 1 26 51
           L 18 52 L 18 44 L 26 45
           A 22 22 0 0 1 31 35
           L 24 30 L 30 24 L 35 31
           A 22 22 0 0 1 45 26
           L 44 18 L 52 18 L 51 26
           A 22 22 0 0 1 61 31
           L 66 24 L 72 30 L 65 35
           A 22 22 0 0 1 70 45 Z"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center hole -->
  <circle cx="48" cy="48" r="10" stroke="#2A262F" stroke-width="2.6"/>
  <!-- Wrench (white-filled, rotated diagonal, appears in front of gear) -->
  <g transform="rotate(-45, 48, 50)" stroke="#2A262F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle body -->
    <rect x="28" y="43" width="52" height="14" rx="4" fill="white"/>
    <!-- Upper jaw arm -->
    <path d="M 28 43 L 20 30 L 14 36 L 14 43 Z" fill="white"/>
    <!-- Lower jaw arm -->
    <path d="M 28 57 L 14 57 L 14 64 L 20 70 Z" fill="white"/>
  </g>
</svg>
