<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Left page (slight perspective: left edge lower) -->
  <path d="M 10 26 L 50 22 L 50 82 L 10 84 Z"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right page (mirror perspective) -->
  <path d="M 50 22 L 90 26 L 90 84 L 50 82 Z"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom spine thickness (left) -->
  <path d="M 10 84 L 12 90 L 50 88 L 50 82"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom spine thickness (right) -->
  <path d="M 50 82 L 50 88 L 88 90 L 90 84"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bookmark ribbon -->
  <path d="M 50 88 L 46 98 L 50 92 L 54 98 Z"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left page ruled lines (slight tilt to match perspective) -->
  <line x1="15" y1="37" x2="45" y2="35" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="15" y1="47" x2="45" y2="45" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="15" y1="57" x2="45" y2="55" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="15" y1="67" x2="45" y2="65" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right page ruled lines -->
  <line x1="55" y1="35" x2="85" y2="37" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="55" y1="45" x2="85" y2="47" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="55" y1="55" x2="85" y2="57" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="55" y1="65" x2="85" y2="67" stroke="#2A262F" stroke-width="1.8" stroke-linecap="round"/>
</svg>
