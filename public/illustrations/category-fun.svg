<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Kite diamond (moved up to leave room for tail) -->
  <path d="M 46 8 L 72 36 L 46 62 L 20 36 Z"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Horizontal cross brace -->
  <line x1="20" y1="36" x2="72" y2="36" stroke="#2A262F" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Vertical cross brace -->
  <line x1="46" y1="8" x2="46" y2="62" stroke="#2A262F" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Tail string (curvy, all within viewBox) -->
  <path d="M 46 62 C 50 70 44 76 48 84 C 52 92 48 97 52 100"
        stroke="#2A262F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Bow-tie 1 -->
  <path d="M 42 68 L 46 64 L 50 68 L 46 72 Z"
        stroke="#2A262F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bow-tie 2 -->
  <path d="M 44 78 L 48 74 L 52 78 L 48 82 Z"
        stroke="#2A262F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bow-tie 3 -->
  <path d="M 46 88 L 50 84 L 54 88 L 50 92 Z"
        stroke="#2A262F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
