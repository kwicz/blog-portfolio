<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Kite diamond -->
  <path d="M 48 10 L 76 42 L 48 68 L 20 42 Z"
        stroke="#2A262F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Horizontal cross brace -->
  <line x1="20" y1="42" x2="76" y2="42" stroke="#2A262F" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Vertical cross brace -->
  <line x1="48" y1="10" x2="48" y2="68" stroke="#2A262F" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Tail string (curvy) -->
  <path d="M 48 68 C 52 76 44 82 50 90 C 54 96 48 100 52 104"
        stroke="#2A262F" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Bow-tie 1 -->
  <path d="M 44 76 L 48 72 L 52 76 L 48 80 Z"
        stroke="#2A262F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bow-tie 2 -->
  <path d="M 46 86 L 50 82 L 54 86 L 50 90 Z"
        stroke="#2A262F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bow-tie 3 -->
  <path d="M 48 96 L 52 92 L 56 96 L 52 100 Z"
        stroke="#2A262F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
